<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VoiceLingo - Voice-to-Voice Translation & Smart Notes</title>
    <meta name="description" content="VoiceLingo by Waseem Asif: Professional Voice-to-Voice Translation and Smart Notes app supporting Urdu, Roman Urdu, English, and Arabic." />
    
    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="VoiceLingo - Voice-to-Voice Translation & Smart Notes" />
    <meta property="og:description" content="Professional Voice-to-Voice Translation and Smart Notes app supporting Urdu, Roman Urdu, English, and Arabic by Waseem Asif." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VoiceLingo - Voice-to-Voice Translation" />
    <meta name="twitter:description" content="Voice-to-Voice Translation & Smart Notes app supporting Urdu, Roman Urdu, English, and Arabic." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoiceLingo" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts for Urdu & Arabic Nastaliq / Naskh & Latin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* Custom font classes for natural RTL and Nastaliq rendering */
      .font-urdu {
        font-family: 'Noto Nastaliq Urdu', 'Amiri', 'Jameel Noori Nastaleeq', serif;
        line-height: 2.2;
      }
      .font-arabic {
        font-family: 'Amiri', 'Noto Sans Arabic', serif;
        line-height: 1.8;
      }
      .font-latin {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      body {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.25);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('VoiceLingo ServiceWorker registered:', reg.scope))
            .catch(err => console.log('ServiceWorker registration error:', err));
        });
      }
    </script>
  </body>
</html>
